<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="hero" id="hero">
        <div class="container">
            <div class="hero__text">
                <span class="trending-now">🔥 Trending Now</span>
                <h2>
                    <span class="h-black">Brutal</span>
                    <span class="h-red">Thoughts</span>
                    <span class="h-blue">Bold Ideas</span>
                </h2>
                <p>Raw, unfiltered content about tech, design, and culture. No sugar-coating, just pure truth that hits different.</p>
                <div class="hero__actions">
                    <button class="btn-black"><img src="/assets/images/icons/rocket-solid-full.png" alt="rocket icon"> Start Reading</button>
                    <button class="btn-white"><img src="/assets/images/icons/play-solid-full.png" alt="play icon"> Watch Intro</button>
                </div>
            </div>
            <div class="hero__image">
                <div class="image-wrapper">
                    <img src="/assets/images/hero-img.png" alt="abstract art">
                </div>
                <div class="featured">FEATURED</div>
            </div>
        </div>
    </div>
    <div class="navbar">
        <div class="container">
            <div class="navbar__logo">
                <span class="txt-black">The UX</span>
                <span class="txt-orange">Review</span>
            </div>
            <div id="side-menu" class="navbar__items">
                <ul class="navbar-side-menu">
                    <li>
                        <div class="side-menu-head">
                            <span>Menu</span>
                            <a href="#hero" class="close-btn"><img src="/assets/images/icons/close.png" alt="close icon"></a>
                        </div>
                    </li>
                    <li><a href="#hero">Home</a></li>
                    <li><img src="/assets/images/icons/star-solid-full.png" alt="solid star"></li>
                    <li><a href="#latest-articles">Latest Articles</a></li>
                    <li><img src="/assets/images/icons/star-solid-full.png" alt="solid star"></li>
                    <li><a href="#authors">Authors</a></li>
                    <li><img src="/assets/images/icons/star-solid-full.png" alt="solid star"></li>
                    <li><a href="#community">Community</a></li>
                    <button class="subscribe-btn">Subscribe Now</button>
                </ul>
            </div>
            <a href="#side-menu" class="menu-btn"><img src="/assets/images/icons/menu.png" alt="menu icon"></a>
        </div>
    </div>
</body>
</html>
